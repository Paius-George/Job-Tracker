name: LinkedIn Job Monitor (24/7)

on:
  schedule:
    # Run every 30 minutes (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Needed to commit back seen jobs database

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Don't burn minutes if a scrape hangs
    concurrency:
      group: job-monitor # Never run two scans in parallel (avoids DB push conflicts)
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Job Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py scan-once

      - name: 💾 Commit & Push Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new jobs since last run - nothing to commit."
          else
            git commit -m "Auto-update job database [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push
          fi
