# ==============================================================================
# Job Alert Bot - Configuration (Bucharest Only | Past 30 Minutes | Entry & Mid Support)
# Platforms: LinkedIn & eJobs.ro (Web Scraping)
# ==============================================================================

settings:
  # Keep this empty - set the webhook via DISCORD_WEBHOOK_URL in .env (local)
  # or as a GitHub Actions secret (free cloud hosting)
  discord_webhook_url: ""
  # Interval for scanning (30 minutes)
  check_interval_minutes: 30
  request_delay_seconds: 3.0
  max_pages_per_search: 2
  fetch_job_details: true
  database_path: "data/jobs.db"
  log_level: "INFO"

  # --- Phase 3: Global junior/internship filtering engine -------------------
  # Safety net applied to ALL search profiles (on top of per-profile filters).
  # junior_filter_enabled: always drop roles with seniority words in the title
  #   (senior/lead/manager/principal/...) or experience demands like "5+ years"
  #   in the description.
  # junior_filter_strict: additionally REQUIRE a junior/intern keyword
  #   (junior, intern, trainee, stagiu, ...) in the title or description.
  junior_filter_enabled: true
  junior_filter_strict: false
  # junior_include_keywords:            # override the built-in include list
  #   - "junior"
  #   - "intern"
  # junior_title_exclude_keywords:      # override the built-in title excludes
  #   - "senior"
  # junior_description_exclude_keywords: # override the built-in description excludes
  #   - "5+ years"

searches:
  # ----------------------------------------------------------------------------
  # 1. IT Support, Helpdesk & Service Desk (Entry / Mid) - Bucharest
  # ----------------------------------------------------------------------------
  - name: "💻 IT Support & Helpdesk (Bucharest - Past 30 Min)"
    enabled: true
    embed_color: "#10B981" # Green
    platforms:
      - "linkedin"
      - "ejobs"
      - "bestjobs"
      - "hipo"
      - "stagiipebune"
      - "ats"
    keywords: '"IT Support" OR Helpdesk OR "Help Desk" OR "Service Desk" OR "Technical Support" OR "IT Technician" OR "Support Engineer" OR "Desktop Support" OR "Suport Tehnic"'
    location: "Bucharest, Romania"
    date_posted: "past_30min" # LinkedIn 30min filter (r1800)
    sort_by: "recent"        # Newest first
    workplace_types:
      - "remote"
      - "hybrid"
      - "on_site"
    experience_levels:
      - "internship"
      - "entry_level"
      - "associate"
      - "mid_senior" # Allowed for mid-level support/helpdesk
    job_types:
      - "full_time"
      - "part_time"
      - "contract"
      - "internship"
    filters:
      max_age_hours: 0.5 # Strictly within the past 30 minutes
      location_must_include:
        - "Bucharest"
        - "Remote"
        - "Bucuresti"
        - "București"
      location_must_exclude:
        - "Cluj"
        - "Brasov"
        - "Brașov"
        - "Timisoara"
        - "Timișoara"
        - "Iasi"
        - "Iași"
        - "Sibiu"
        - "Craiova"
        - "Constanta"
        - "Constanța"
      title_must_include:
        - "Helpdesk"
        - "Help Desk"
        - "Support"
        - "Service Desk"
        - "Technician"
        - "IT Specialist"
        - "IT Assistant"
        - "Desktop Support"
        - "Suport Tehnic"
        - "Tier 1"
        - "Tier 2"
        - "1st Line"
        - "2nd Line"
      title_must_exclude:
        - "Senior"
        - "Lead"
        - "Staff"
        - "Principal"
        - "Manager"
        - "Director"
        - "Head of"
        - "Architect"
        - "VP"
      description_must_include: []
      description_must_exclude: []
      companies_include: []
      companies_exclude: []

