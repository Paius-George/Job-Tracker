# ==============================================================================
# LinkedIn Job Alert Bot - Configuration (Cybersecurity & IT - Bucharest Only)
# ==============================================================================

settings:
  discord_webhook_url: ""
  check_interval_minutes: 30
  request_delay_seconds: 3.0
  max_pages_per_search: 2
  fetch_job_details: true
  database_path: "data/jobs.db"
  log_level: "INFO"

searches:
  # ----------------------------------------------------------------------------
  # 1. Junior Penetration Testing & Ethical Hacking & Security Testing
  # ----------------------------------------------------------------------------
  - name: "🛡️ Pentesting & Cybersecurity (Bucharest)"
    enabled: true
    embed_color: "#E02424" # Red
    keywords: 'Cybersecurity OR "Security Analyst" OR "Penetration Tester" OR Pentester OR "Ethical Hacker" OR "Security Engineer"'
    location: "Bucharest, Romania"
    date_posted: "past_24h"
    sort_by: "recent"
    workplace_types:
      - "remote"
      - "hybrid"
      - "on_site"
    experience_levels:
      - "internship"
      - "entry_level"
      - "associate"
    job_types:
      - "full_time"
      - "part_time"
      - "contract"
      - "internship"
    filters:
      location_must_include:
        - "Bucharest"
        - "Bucuresti"
        - "București"
      title_must_include:
        - "Cyber"
        - "Security"
        - "Pentest"
        - "Penetration"
        - "Ethical"
        - "Vulnerability"
        - "SecOps"
        - "Information Security"
        - "InfoSec"
      title_must_exclude:
        - "Senior"
        - "Lead"
        - "Staff"
        - "Principal"
        - "Manager"
        - "Director"
        - "Head of"
        - "Architect"
        - "VP"
      description_must_include: []
      description_must_exclude: []
      companies_include: []
      companies_exclude: []

